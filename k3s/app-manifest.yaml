# =====================================================================
# Manifest di avvio della piattaforma DT su K3s.
# Solo cio' che deve esistere prima: Mongo, Authentication, DT_factory (+ permessi)
# e un pod Digital_Replica sempre acceso solo per la registrazione delle DR.
# I DT (DR + servizi) li crea la DT_factory; la dashboard gira sul pc.
# Avvio:  sudo k3s kubectl apply -f k3s/app-manifest.yaml
# =====================================================================

# ---------------------------------------------------------------------
# DATABASE: MongoDB condiviso (DB_generico, Digital_Replica, Digital_Twin)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mio-mongo
spec:
  selector:
    matchLabels:
      app: mio-mongo
  template:
    metadata:
      labels:
        app: mio-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:7.0
        ports:
        - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mio-mongo            # mongodb://mio-mongo:27017 (solo dentro il cluster)
spec:
  selector:
    app: mio-mongo
  ports:
  - port: 27017
    targetPort: 27017

---
# ---------------------------------------------------------------------
# AUTHENTICATION: utenti, login, DR dell'utente
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
spec:
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      containers:
      - name: authentication
        image: gcrta29/authentication:v70    # METTI IL TUO TAG
        ports:
        - containerPort: 5005
        env:
        - name: DATABASE_URL
          value: "mongodb://mio-mongo:27017/DB_generico"
---
apiVersion: v1
kind: Service
metadata:
  name: authentication
spec:
  type: NodePort             # raggiungibile dal pc: http://<IP VM>:30505
  selector:
    app: authentication
  ports:
  - port: 5005
    targetPort: 5005
    nodePort: 30505

---
# ---------------------------------------------------------------------
# DT_FACTORY: crea i DT su K3s e legge i risultati dei servizi
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dt-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dt-factory
  template:
    metadata:
      labels:
        app: dt-factory
    spec:
      serviceAccountName: dt-factory     # permessi definiti in fondo
      containers:
      - name: dt-factory
        image: gcrta29/dt-factory:v2     
        ports:
        - containerPort: 5003
        env:
        - name: DATABASE_URL
          value: "mongodb://mio-mongo:27017/Digital_Twin"
---
apiVersion: v1
kind: Service
metadata:
  name: dt-factory
spec:
  type: NodePort             # raggiungibile dal pc: http://<IP VM>:30503
  selector:
    app: dt-factory
  ports:
  - port: 5003
    targetPort: 5003
    nodePort: 30503

---
# ---------------------------------------------------------------------
# DR-REGISTRATION: Digital_Replica sempre accesa, usata solo per
# /api/registration (le DR vere nascono dentro i DT)
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dr-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dr-registration
  template:
    metadata:
      labels:
        app: dr-registration
    spec:
      containers:
      - name: digital-replica
        image: gcrta29/digital-replica:v114    
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: DATABASE_URL
          value: "mongodb://mio-mongo:27017/Digital_Replica"
---
apiVersion: v1
kind: Service
metadata:
  name: dr-registration
spec:
  type: NodePort             # raggiungibile dal pc: http://<IP VM>:30500/api/registration
  selector:
    app: dr-registration
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500

---
# ---------------------------------------------------------------------
# PERMESSI DELLA DT_FACTORY: puo' creare/leggere/cancellare
# Deployment, Service e pod nel namespace default
# ---------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dt-factory
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crea-dt
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["services", "pods"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dt-factory-crea-dt
  namespace: default
subjects:
- kind: ServiceAccount
  name: dt-factory
  namespace: default
roleRef:
  kind: Role
  name: crea-dt
  apiGroup: rbac.authorization.k8s.io
