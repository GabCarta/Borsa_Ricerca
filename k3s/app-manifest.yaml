# Permessi della DT_factory, che gira FUORI dal cluster (docker-compose di gestione).
# Nel cluster ci sono solo i DT, un namespace per utente (user-<id>): la factory
# deve poter lavorare in tutti, quindi ClusterRole, limitato a quello che serve.
#
#   sudo k3s kubectl apply -f k3s/app-manifest.yaml
#   sudo bash k3s/crea_kubeconfig.sh <IP della VM>   -> gestione/kubeconfig/dt-factory.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: dt-system            # contiene solo l'account della factory, nessun pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dt-factory
  namespace: dt-system
---
# token dell'account, usato nel kubeconfig della factory
apiVersion: v1
kind: Secret
metadata:
  name: dt-factory-token
  namespace: dt-system
  annotations:
    kubernetes.io/service-account.name: dt-factory
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dt-factory
rules:
# namespace degli utenti: creati al primo DT (o all'approvazione), cancellati con l'utente
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "create", "delete"]
# pod del DT: Deployment, avvio/arresto con scale
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "delete", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments/scale"]
  verbs: ["get", "patch", "update"]
# oggetti del DT: porte, profili e configurazione, chiavi, volume del db, quota
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets", "persistentvolumeclaims", "resourcequotas"]
  verbs: ["get", "list", "create", "delete"]
# chiamate alle API dei servizi del DT, che non sono esposti fuori dal cluster
- apiGroups: [""]
  resources: ["services/proxy"]
  verbs: ["get", "create"]
# stato e log dei container
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
# isolamento tra i namespace degli utenti
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dt-factory
subjects:
- kind: ServiceAccount
  name: dt-factory
  namespace: dt-system
roleRef:
  kind: ClusterRole
  name: dt-factory
  apiGroup: rbac.authorization.k8s.io
