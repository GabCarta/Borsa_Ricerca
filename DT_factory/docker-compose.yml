#USATO PER I TEST
services:
  # Database
  mio_mongo:
    image: mongo:7.0
    container_name: mio-mongo
    ports:
      - "27018:27017" 
    networks:
      - rete_comune

  # Service
  service:
    image: gcrta29/service:v24
    container_name: service
    ports:
      - "5001:5001"
    depends_on:
      - mio_mongo
    environment:
      - DATABASE_URL=mongodb://mio-mongo:27017/Digital_Replica
    networks:
      - rete_comune

  # Digital Replica
  digital-replica:
    image: gcrta29/digital-replica:v112
    container_name: digital-replica
    ports:
      - "5000:5000"
    volumes:
      - "../Digital_Replica/profile:/app/profile"
    depends_on:
      - mio_mongo
    environment:
      - DATABASE_URL=mongodb://mio-mongo:27017/Digital_Replica
    networks:
      - rete_comune

  # Authentication
  authentication:
    image: gcrta29/authentication:v61
    container_name: authentication
    ports:
      - "5005:5005"
    depends_on:
      - mio_mongo
    environment:
      - DATABASE_URL=mongodb://mio-mongo:27017/DB_generico
      - ADMIN_EMAIL=admin@dtplatform.local
      - ADMIN_PASSWORD=admin
    networks:
      - rete_comune

  # Dashboard
  dashboard:
    image: gcrta29/dashboard:v120
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      - digital-replica
      - service
      - authentication
    networks:
      - rete_comune

networks:
  rete_comune:
    name: rete_comune_progetto